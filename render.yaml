services:
  - type: web
    name: footfall
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn footfall.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: QLOO_HACK_API_KEY
        sync: false
      - key: NEBIUS_HACK_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: nebius
      - key: FOOTFALL_CACHE_DIR
        value: .cache
      # Spend ledger and replay packs: a private repo, because Render's disk is
      # wiped on restart. Without these two, the app makes no LLM calls on Render.
      - key: FOOTFALL_STORE_REPO
        value: JannetEkka/footfall-private
      - key: FOOTFALL_STORE_TOKEN
        sync: false
      - key: FOOTFALL_BUDGET_USD
        value: "15"
      - key: FOOTFALL_RUNS_PER_DAY
        value: "20"
